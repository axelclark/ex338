databases:
  - name: ex338-db
    plan: basic_256mb
    databaseName: ex338
    postgresMajorVersion: "16"

services:
  - type: web
    name: ex338
    runtime: elixir
    # 2 GB / 1 CPU. The 512 MB starter plan OOM-killed the instance dozens of
    # times a day once the 2027 draft started, when concurrent draft boards
    # pushed memory from a ~230 MB baseline to ~500 MB peaks.
    plan: standard
    buildCommand: ./build.sh
    startCommand: _build/prod/rel/ex338/bin/migrate && _build/prod/rel/ex338/bin/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ex338-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: HOST
        value: the338challenge.com
      - key: ELIXIR_VERSION
        value: "1.18.3"
      - key: ERLANG_VERSION
        value: "27.3"
      - key: NODE_VERSION
        value: "22.14.0"
